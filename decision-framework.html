5,title:"Deep professional skills",desc:"1-2 functions learned deeply with mentored feedback. Pattern recognition from experienced operators. Structured reps compress self-teaching. You learn what professional excellence looks like. Narrower but more polished."}},{name:"AI mastery",a:{score:9,title:"Applied daily, explicit priority",desc:"Building real AI products for real clients every day. Voice agents, SEO automation, website generation, custom tools. Partner's CS/aerospace depth means you learn architecture alongside application. With AI mastery as an explicit priority, the volume of hands-on reps across verticals creates top 1% applied AI competence. Superuser trajectory."},b:{score:5.5,title:"Company-dependent",desc:"If AI-native startup: strong. If not: AI as personal productivity tool only. Narrower application domain. One user among many, not the architect of the AI stack. Less control over depth."}},{name:"Entrepreneurship",a:{score:9.5,title:"Direct, skin in the game",desc:"Full-stack operator with real consequences. Sales, pricing, negotiation, client management, hiring commission team, product iteration, pivoting. If it works, you own it. You'll discover whether you actually want this life."},b:{score:5,title:"Observational",desc:"See how a founder operates from the inside. Learn what works without bearing the cost of mistakes. Someone else's company, risk, and decisions. You learn about entrepreneurship, not through it."}},{name:"Value alignment",a:{score:9.5,title:"Freedom, courage, self-mastery",desc:"Maximizes control over your time. Directly expresses your philosophy. Meaningful challenge on your terms. Not optimizing for money but for a life well-lived. This is what your 22-year-old chapter calls for."},b:{score:6,title:"Discipline, compounding, humility",desc:"Aligned with your atomic habits principle. Less exciting but more structured. Tests discipline through external friction. Trades freedom for stability."}},{name:"Regret risk",a:{score:9.5,title:"Minimal",desc:"No girlfriend, no lease, no job attachment, maximum family support. This exact combination of freedom may never recur. A relationship, a job you enjoy, a sense of obligation \u2014 any can quietly close the window. Not doing this will almost certainly haunt you."},b:{score:4.5,title:"Real and lingering",desc:"'I played it safe when I had nothing to lose.' At 28 with a partner and career, you'll wonder. You could still travel at 24 \u2014 but will you? Life fills the space. Comfort breeds inertia."}},{name:"Network",a:{score:4.5,title:"Global, diffuse",desc:"Travelers, expats, entrepreneurs abroad, SMB owners remotely. Co-founder as daily peer. Vic Strecher as mentor. Frat network for sales. Interesting, diverse people \u2014 but few high-leverage professional contacts."},b:{score:9,title:"Dense, compounding",desc:"Daily proximity to ambitious builders. Founder's network: investors, advisors, other founders. Alumni from good startups get pulled into the best opportunities for decades. Ages 22-25 = peak window."}},{name:"Accountability",a:{score:3.5,title:"Self-imposed + external checkpoints",desc:"No boss, no performance review. You set your own KPIs. Vic Strecher as quarterly check. Co-founder as partner, not manager. The quarterly audit structure mitigates the weakness \u2014 but requires discipline to enforce. The default state is structurally low regardless of personal character."},b:{score:9,title:"External, daily, unavoidable",desc:"Someone else sets the bar. Measured, managed, given candid feedback. Gaps in ability become visible fast. No room for narrative to override reality. The structure works whether you feel like it or not."}},{name:"Financial sufficiency",a:{score:5.5,title:"Lean but achievable",desc:"The goal is sustainability, not wealth. SE Asia: $1.5-2K/mo. South America similar. Africa even lower. Setup fees + retainers need to cover lifestyle. Family as backstop. You're optimizing for enough, not for more."},b:{score:7,title:"
